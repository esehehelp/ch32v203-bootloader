; CH32V203 USB CDC bootloader + ch32v-cdc
;   env:app         — your application at 0x2000 (src/app), uploaded over USB:
;                     1200bps touch → CDC bootloader. `pio run -t upload`
;   env:bootloader  — USB CDC bootloader at 0x0000 (src/boot), installed once
;                     through the factory BootROM: hold BOOT0, reset, then
;                     `pio run -e bootloader -t upload`
;   env:gameboard   — example app (examples/gameboard): 128x64 I2C OLED demo
;
; Defaults target CH32V203K8/C8 (64K flash, 20K RAM). For other parts change
; `board` and the MEMORY lengths in src/link_app.ld / src/link_boot.ld.

[platformio]
default_envs = app

[env]
platform = https://github.com/Community-PIO-CH32V/platform-ch32v.git
board = genericCH32V203K8T6
monitor_speed = 115200
extra_scripts = pre:ch32_cdcboot.py
build_flags =
    -nostartfiles
    -Os
    -Wall
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -Wl,--no-relax
    -mno-relax
    -Wl,-L"src"
build_src_filter = +<startup.S> +<app/>
upload_protocol = ch32-cdcboot

[env:app]
build_flags =
    ${env.build_flags}
    -Wl,-T"src/link_app.ld"

[env:bootloader]
build_flags =
    ${env.build_flags}
    -DCH32V_CDC_BOOTLOADER
    -Wl,-T"src/link_boot.ld"
    ; -DBOOT_DOUBLE_TAP_MS=500                      ; 0 = no double-tap, no delay
    ; -DBOOT_BUTTON_PORT=GPIOA -DBOOT_BUTTON_PIN=1  ; optional recovery button
build_src_filter = +<startup.S> +<boot/>
upload_protocol = wchisp-bootrom

[env:gameboard]
build_flags =
    ${env.build_flags}
    -Wl,-T"src/link_app.ld"
build_src_filter = +<startup.S> +<../examples/gameboard/>
monitor_eol = CR
